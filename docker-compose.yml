# AIFU Learning Platform — local development stack.
#
# SCOPE OF THIS FILE (honest, see docs/BUILD-STATUS.md): `postgres` + `api` + `execution-worker`,
# the last wired to the `docker-run` sandbox engine, NOT `judge0` — `docker/judge0/` is still
# empty. `docker-run` is ADR-006's reference/fallback engine, deliberately not the production
# default (`EXECUTION_ENGINE=judge0` in `.env.example`); this compose file overrides it to
# `docker-run` so the stack is actually runnable end-to-end without standing up Judge0's own
# Postgres+Redis. Swap in a `judge0` service (and flip `EXECUTION_ENGINE` back) when that
# infrastructure is actually stood up — a separate, reviewed change.
#
# `cp .env.example .env` first, then `docker compose up --build`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # This single role is also the cluster superuser for this LOCAL/DEV instance — simplest
      # correct option for a single-project compose stack (PENDING-INPUTS.md-style pragmatic
      # call). A real deployment provisions Postgres separately, out of band, with narrower roles.
      POSTGRES_USER: ${DB_USERNAME:-aifu_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_only_app_password_change_me}
      POSTGRES_DB: ${DB_NAME:-aifu_lms}
      DB_WORKER_USERNAME: ${DB_WORKER_USERNAME:-aifu_execution_worker}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:-dev_only_worker_password_change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Host port intentionally non-default: avoids clashing with a Postgres already running
      # locally on 5432. Containers reach this service as `postgres:5432` regardless.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-aifu_app} -d ${DB_NAME:-aifu_lms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [aifu-net]

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aifu_lms}
      DB_USERNAME: ${DB_USERNAME:-aifu_app}
      DB_PASSWORD: ${DB_PASSWORD:-dev_only_app_password_change_me}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-aifu-lms}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P30D}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AUTH_MAX_FAILED_ATTEMPTS: ${AUTH_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCKOUT_DURATION: ${AUTH_LOCKOUT_DURATION:-PT15M}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-300}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_ROOT: /var/lib/aifu/storage
      STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:-52428800}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      MANAGEMENT_ENDPOINTS: ${MANAGEMENT_ENDPOINTS:-health,info,metrics,prometheus}
    volumes:
      - api-storage:/var/lib/aifu/storage
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    networks: [aifu-net]

  execution-worker:
    build:
      context: .
      dockerfile: docker/execution-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aifu_lms}
      # The RESTRICTED role (V014), never the app role — this process must never be able to read
      # a password hash, a refresh token, the audit log, or the gradebook.
      DB_WORKER_USERNAME: ${DB_WORKER_USERNAME:-aifu_execution_worker}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:-dev_only_worker_password_change_me}
      # docker-run, not judge0 — see the file-header comment. Never point this at a real Judge0
      # instance from here without also actually standing one up.
      EXECUTION_ENGINE: docker-run
      EXECUTION_WORKER_CONCURRENCY: ${EXECUTION_WORKER_CONCURRENCY:-2}
      EXECUTION_POLL_INTERVAL: ${EXECUTION_POLL_INTERVAL:-PT1S}
      EXECUTION_DEFAULT_CPU_TIME_LIMIT_MS: ${EXECUTION_DEFAULT_CPU_TIME_LIMIT_MS:-5000}
      EXECUTION_DEFAULT_WALL_TIME_LIMIT_MS: ${EXECUTION_DEFAULT_WALL_TIME_LIMIT_MS:-10000}
      EXECUTION_DEFAULT_MEMORY_LIMIT_KB: ${EXECUTION_DEFAULT_MEMORY_LIMIT_KB:-262144}
      EXECUTION_MAX_OUTPUT_BYTES: ${EXECUTION_MAX_OUTPUT_BYTES:-65536}
    volumes:
      # SECURITY-RELEVANT, deliberate (see docker/execution-worker/Dockerfile's header comment):
      # docker-run's "docker-outside-of-docker" design needs the worker to reach the HOST's docker
      # daemon to launch each sandboxed run as a sibling container. This grants the worker
      # container root-equivalent power over the host — never something to do casually, and never
      # something to do for the SANDBOX container itself (ADR-006: the sandbox is
      # --network=none/--read-only/non-root/all-caps-dropped and never touches this socket).
      # This is precisely why Judge0 — which needs no socket access from the worker at all — is
      # ADR-006's named production default; docker-run is the fallback for environments without
      # it. See docs/code-execution/security-model.md.
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [aifu-net]

volumes:
  postgres-data:
  api-storage:

networks:
  aifu-net:
